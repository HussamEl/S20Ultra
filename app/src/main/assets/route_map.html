<!doctype html>
<!--
  The tablet's map of the way (RouteMap.kt). Google's map with the driver's own key; no device
  location. The app hands it the vehicle's position (setCar), the way (setWay: the stops in turn,
  lettered A, B, C…, the one looked at, and each leg's line) and when to come and go (reveal,
  conceal); nothing else is sent anywhere from here. The map grows and fades here, in the page:
  the app never scales or fades the WebView itself, so the map is drawn the same on every device.

  One page, one map for the display's whole life: what changes is only what it shows. Google bills
  each map made, not what is done with it. It is the minute's moment, only looked at, and the
  driver's own (hold), opened by his tap and moved by his touch and the app's buttons (zoom, toCar,
  toStop, whole). Google's 3D view and street photos are not made here: the app opens Google's own
  apps for them, which costs the driver's key nothing.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root { --ground: __GROUND__; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--ground); }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; opacity: 0; transform: scale(0.06); will-change: transform, opacity; }
  #map { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: var(--ground); pointer-events: none; }
  body.held #map { pointer-events: auto; }
  /* Held, more of the map is seen: only the bottom keeps its full fade, under the minutes. */
  body.held .top, body.held .left, body.held .right { opacity: 0.45; }
  .fade { position: absolute; pointer-events: none; }
  .top { left: 0; right: 0; top: 0; height: 18%; }
  .bottom { left: 0; right: 0; bottom: 0; height: 34%; }
  .left { top: 0; bottom: 0; left: 0; width: 14%; }
  .right { top: 0; bottom: 0; right: 0; width: 14%; }
  .dot { position: absolute; transform: translate(-50%, -50%); border-radius: 50%; box-sizing: border-box; }
  .car { width: 26px; height: 26px; background: #1A73E8; border: 5px solid #FFFFFF;
         box-shadow: 0 0 0 10px rgba(26, 115, 232, 0.22), 0 2px 8px rgba(0, 0, 0, 0.35); }
  .pin { position: absolute; transform: translate(-50%, -50%); line-height: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="map"></div>
  <div class="fade top"></div><div class="fade bottom"></div><div class="fade left"></div><div class="fade right"></div>
</div>
<script>
  var NIGHT = __NIGHT__;
  var GROUND = '__GROUND__';
  // How small the map starts, as it grows out of the map sign.
  var FROM = 0.06;
  // Without the map's pictures this long after it is shown, the app is told.
  var TILES_WAIT_MS = 12000;
  var map = null, carDot = null, Dot = null, lines2d = [], pins2d = [];
  // The way: its stops in turn (points, or null until known), the one looked at, each leg's line.
  var car = null, stops = [], focusAt = 0, legs = [], shown = false, tiles = false;
  var LETTERS = 'ABCDEFGHIJK';
  var stage = document.getElementById('stage');
  // The driver's own map (hold): the same map, under his touch.
  var held = false;

  // Anything that stops the map is told to the app (which shows it under the map; nothing is logged).
  function problem(kind, detail) {
    try { Android.onProblem(kind, String(detail || '').slice(0, 120)); } catch (e) {}
  }
  window.onerror = function (message) { problem('page', message); };
  window.addEventListener('unhandledrejection', function (e) { problem('page', e.reason && e.reason.message || e.reason); });
  window.gm_authFailure = function () { Android.onAuthFailure(); };

  // The map's edges melt into the screen's ground, from solid at the edge to clear inside.
  function paintFades() {
    var n = parseInt(GROUND.slice(1), 16), rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
    function fade(to) {
      return 'linear-gradient(' + to + ', rgba(' + rgb + ',1) 0%, rgba(' + rgb + ',0.82) 30%, rgba(' + rgb + ',0.38) 60%, rgba(' + rgb + ',0.1) 85%, rgba(' + rgb + ',0) 100%)';
    }
    document.querySelector('.top').style.background = fade('to bottom');
    document.querySelector('.bottom').style.background = fade('to top');
    document.querySelector('.left').style.background = fade('to right');
    document.querySelector('.right').style.background = fade('to left');
  }
  paintFades();

  // The display's look (black or light) changed: the same map, in the new colours.
  function setLook(night, ground) {
    NIGHT = night;
    GROUND = ground;
    document.documentElement.style.setProperty('--ground', ground);
    paintFades();
    if (!map) return;
    try {
      map.setOptions({ styles: NIGHT ? dark : quiet, backgroundColor: GROUND });
      draw(false);
    } catch (e) {}
  }

  var quiet = [
    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
    { featureType: 'transit', stylers: [{ visibility: 'off' }] }
  ];
  // Neutral greys on the passenger display's black, light enough to be read in a car.
  var dark = quiet.concat([
    { elementType: 'geometry', stylers: [{ color: '#22262c' }] },
    { elementType: 'labels.text.fill', stylers: [{ color: '#c3c8cf' }] },
    { elementType: 'labels.text.stroke', stylers: [{ color: '#22262c' }] },
    { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#3b4048' }] },
    { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#525862' }] },
    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#10213a' }] }
  ]);

  // Google's script is here: the map is made once the page has its size (a map made at no size
  // can stay blank).
  function ready() {
    var div = document.getElementById('map');
    if (!div.offsetWidth || !div.offsetHeight) { setTimeout(ready, 200); return; }
    google.maps.importLibrary('maps').then(make, function (e) { problem('page', e && e.message || e); });
  }

  function make() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: 59.38, lng: 13.5 }, zoom: 14,
      disableDefaultUI: true, gestureHandling: 'none', keyboardShortcuts: false,
      clickableIcons: false, backgroundColor: GROUND, styles: NIGHT ? dark : quiet
    });
    map.addListener('tilesloaded', function () {
      if (tiles) return;
      tiles = true;
      Android.onTiles();
    });
    Dot = function (cls, html) { this.div = document.createElement('div'); this.div.className = cls; if (html) this.div.innerHTML = html; this.at = null; };
    Dot.prototype = new google.maps.OverlayView();
    Dot.prototype.onAdd = function () { this.getPanes().overlayMouseTarget.appendChild(this.div); };
    Dot.prototype.draw = function () {
      var projection = this.getProjection();
      if (!this.at || !projection) { this.div.style.display = 'none'; return; }
      var p = projection.fromLatLngToDivPixel(new google.maps.LatLng(this.at.lat, this.at.lng));
      this.div.style.display = 'block';
      this.div.style.left = p.x + 'px';
      this.div.style.top = p.y + 'px';
    };
    Dot.prototype.onRemove = function () { this.div.remove(); };
    Dot.prototype.place = function (at) { this.at = at; this.draw(); };
    carDot = new Dot('dot car'); carDot.setMap(map);
    draw(true);
    Android.onReady();
    if (shown) waitForTiles();
    if (held) map.setOptions({ gestureHandling: 'greedy' });
  }

  // The map grows out of (x, y), fractions of the screen, over ms.
  function reveal(x, y, ms) {
    shown = true;
    stage.style.transformOrigin = (x * 100) + '% ' + (y * 100) + '%';
    stage.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.4, 0, 0.2, 1), opacity ' + Math.round(ms / 1.6) + 'ms ease-out';
    stage.style.opacity = '1';
    stage.style.transform = 'scale(1)';
    if (!map) return;
    try { draw(true); } catch (e) { problem('page', e && e.message); }
    waitForTiles();
  }

  // Back into where it came from, over ms.
  function conceal(ms) {
    shown = false;
    stage.style.transition = 'transform ' + ms + 'ms cubic-bezier(0.4, 0, 1, 1), opacity ' + ms + 'ms ease-in';
    stage.style.opacity = '0';
    stage.style.transform = 'scale(' + FROM + ')';
  }

  function waitForTiles() {
    if (tiles) return;
    setTimeout(function () { if (shown && !tiles) problem('tiles', ''); }, TILES_WAIT_MS);
  }

  function setCar(lat, lng) {
    car = { lat: lat, lng: lng };
    if (map) draw(false);
  }

  // The way: {stops: [[lat, lng] or null…], focus: n, legs: [[[lat, lng]…]…] or null (not yet)}.
  function setWay(w) {
    stops = (w.stops || []).map(function (p) { return p ? { lat: p[0], lng: p[1] } : null; });
    focusAt = Math.max(0, Math.min(stops.length - 1, w.focus || 0));
    legs = (w.legs || []).map(function (leg) { return leg.map(function (p) { return { lat: p[0], lng: p[1] }; }); });
    if (map) draw(!held);
  }

  // Every point of the way, for the view to take in.
  function wayPoints() {
    var all = [];
    legs.forEach(function (leg) { all = all.concat(leg); });
    stops.forEach(function (p) { if (p) all.push(p); });
    return all;
  }

  // The stop looked at: its point, else where its leg ends.
  function target() {
    var s = stops[focusAt];
    if (s) return s;
    var leg = legs[focusAt];
    return leg && leg.length ? leg[leg.length - 1] : null;
  }

  // A stop's letter on a round pin: larger and red for the one looked at.
  function pinSvg(i) {
    var focus = i === focusAt, size = focus ? 58 : 40, half = size / 2;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + half + '" cy="' + half + '" r="' + (half - 3) + '" fill="' + (focus ? '#EA4335' : '#1A73E8') + '" stroke="#FFFFFF" stroke-width="4"/>' +
      '<text x="' + half + '" y="' + half + '" dy="0.36em" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="' + (focus ? 28 : 19) + '" fill="#FFFFFF">' +
      LETTERS.charAt(i) + '</text></svg>';
  }

  // A leg up to the stop looked at is drawn full; the legs after it, lighter.
  function legStyle(i) { return i <= focusAt ? { color: '#1A73E8', opacity: 1, weight: 8 } : { color: '#1A73E8', opacity: 0.45, weight: 6 }; }

  function draw(refit) {
    lines2d.forEach(function (l) { l.setMap(null); });
    lines2d = [];
    legs.forEach(function (leg, i) {
      var st = legStyle(i);
      if (i <= focusAt) lines2d.push(new google.maps.Polyline({ map: map, path: leg, strokeColor: NIGHT ? '#0B3D91' : '#FFFFFF', strokeWeight: st.weight + 5, strokeOpacity: 1, clickable: false }));
      lines2d.push(new google.maps.Polyline({ map: map, path: leg, strokeColor: st.color, strokeWeight: st.weight, strokeOpacity: st.opacity, clickable: false }));
    });
    pins2d.forEach(function (d) { d.setMap(null); });
    pins2d = [];
    stops.forEach(function (p, i) {
      var at = p || (legs[i] && legs[i].length ? legs[i][legs[i].length - 1] : null);
      if (!at) return;
      var pin = new Dot('pin', pinSvg(i));
      pin.at = at;
      pin.setMap(map);
      pins2d.push(pin);
    });
    carDot.place(car);
    var bounds = new google.maps.LatLngBounds();
    wayPoints().forEach(function (p) { bounds.extend(p); });
    if (car) bounds.extend(car);
    if (bounds.isEmpty()) return;
    var seen = map.getBounds();
    if (refit || !seen || (!held && car && !seen.contains(car))) {
      if (wayPoints().length) map.fitBounds(bounds, clear()); else { map.setCenter(car); map.setZoom(15); }
    }
  }

  // The way keeps to the clear middle: with room for the minutes and distance at the bottom, or,
  // on the driver's own map, for his list of trips (where he put it) and his buttons at the right.
  function clear() {
    var d = map.getDiv(), w = d.offsetWidth, h = d.offsetHeight;
    if (held) return { top: Math.round(h * 0.1), bottom: Math.round(h * 0.1), left: Math.round(w * Math.max(0.16, listRoom.left)), right: Math.round(w * Math.max(0.12, listRoom.right)) };
    return { top: Math.round(h * 0.2), bottom: Math.round(h * 0.34), left: Math.round(w * 0.16), right: Math.round(w * 0.16) };
  }
  // How much of the map's width the driver's list of trips covers from its left or its right.
  var listRoom = { left: 0.3, right: 0 };
  function room(left, right) {
    listRoom = { left: left, right: right };
  }

  // --- The driver's own map ---------------------------------------------------------------

  // Opened (true) by the driver's tap, or closed: the map takes his touches while it is his.
  function hold(on) {
    held = on;
    document.body.classList.toggle('held', on);
    if (map) map.setOptions({ gestureHandling: on ? 'greedy' : 'none' });
  }

  // The app's buttons: closer (1) or farther (-1); to the car; to the stop; the whole way. A map
  // that cannot move (Google refused it) stays as it is.
  function button(f) {
    return function () { try { f.apply(null, arguments); } catch (e) {} };
  }

  var zoom = button(function (step) {
    if (map) map.setZoom(map.getZoom() + step);
  });

  var toCar = button(function () {
    if (!car || !map) return;
    map.panTo(car);
    map.setZoom(16);
  });

  var toStop = button(function () {
    var s = target();
    if (!s || !map) return;
    map.panTo(s);
    map.setZoom(17);
  });

  // Stop i of the way, on the map.
  var lookAt = button(function (i) {
    var s = stops[i] || (legs[i] && legs[i].length ? legs[i][legs[i].length - 1] : null);
    if (!s || !map) return;
    map.panTo(s);
    map.setZoom(17);
  });

  // The car, the way and the stops at once.
  var whole = button(function () {
    if (map) draw(true);
  });

  // Google's script, tried again every half minute while it does not come (no internet yet).
  function load() {
    var script = document.createElement('script');
    script.async = true;
    script.src = 'https://maps.googleapis.com/maps/api/js?key=__KEY__&callback=ready&loading=async&language=sv&region=SE';
    script.onerror = function () { script.remove(); problem('script', ''); setTimeout(load, 30000); };
    document.body.appendChild(script);
  }
  load();
</script>
</body>
</html>
