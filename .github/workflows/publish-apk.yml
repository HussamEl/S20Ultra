# Publishes a signed build as the GitHub Release "v<version>" (Hussam's decision, 1.9).
#
# The APK is signed where it is built (the key never reaches GitHub) and handed over by
# tools/publish-apk.sh on a short-lived branch "apk-drop/v<version>". Its one commit adds
# dist/NastaStopp.apk and dist/NOTES.md on top of the source commit. This workflow tags the
# source commit (without the APK), attaches the APK to the release and deletes the branch, so
# builds never stay in the branch history.
name: Publish APK

on:
  push:
    branches: ['apk-drop/v*']

permissions:
  contents: write

concurrency: publish-apk

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version="${BRANCH#apk-drop/}"
          source="$(git rev-parse HEAD^)"
          test -s dist/NastaStopp.apk
          test -s dist/NOTES.md
          gh release create "$version" dist/NastaStopp.apk \
            --target "$source" --title "Nästa Stopp ${version#v}" --notes-file dist/NOTES.md

      - name: Delete the hand-over branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: git push origin --delete "$BRANCH"
