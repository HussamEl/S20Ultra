# Deletes a published build: the GitHub Release "<tag>" and its tag. Run by hand
# (workflow_dispatch) when a Release was published by mistake.
name: Delete release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to delete (e.g. v1.0)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --cleanup-tag --yes
